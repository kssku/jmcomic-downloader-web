# ════════════════════════════════════════════════════════════════════
#  jmcomic-downloader-web —— 飞牛 NAS / Docker Compose 部署
#
#  用法：
#    1. cp .env.example .env   # 然后改掉 JM_AUTH_TOKEN
#    2. docker compose up -d --build
#    3. 浏览器打开 http://<NAS IP>:8081
#
#  常用命令：
#    docker compose logs -f          # 看实时日志
#    docker compose up -d --build    # 改代码后重建
#    docker compose down             # 停止（数据卷保留）
# ════════════════════════════════════════════════════════════════════

services:
  jmcomic-downloader-web:
    # 镜像由手动 docker build 产出（见 README / 部署说明）。
    # 不用 compose 的 build 段：Rust release 构建需要代理拉 crates.io，
    # 手动构建时用 --build-arg 传代理更可控。
    image: jmcomic-server:api-only
    container_name: jmcomic-server

    # unless-stopped：NAS 重启后自动拉起，手动 stop 的则保持停止
    restart: unless-stopped

    ports:
      # 左边是 NAS 上对外暴露的端口，被占用就改成别的（如 18081）
      # 默认 8081，避免与 pica 版（8080）冲突
      - "${JM_HOST_PORT:-8081}:8080"

    environment:
      # ── 认证 ──────────────────────────────────────────────────────
      # 首次留空会自动生成随机 Token，并在 `docker compose logs` 里
      # 打印一次；想固定下来就把生成的值填进 .env。
      JM_AUTH_TOKEN: "${JM_AUTH_TOKEN:-}"
      JM_AUTH_USER: "${JM_AUTH_USER:-admin}"
      JM_AUTH_DISABLED: "${JM_AUTH_DISABLED:-false}"

      # ── 服务 ──────────────────────────────────────────────────────
      JM_BIND: "0.0.0.0"
      JM_PORT: "8080"
      TZ: "${TZ:-Asia/Shanghai}"

      # ── 运行期代理（可选，但国内几乎必填）─────────────────────────
      # 与上面的 BUILD_*_PROXY 是两回事：那两个只作用于构建，这两个只
      # 作用于运行期。
      #
      # 什么时候需要：如果 NAS 直连禁漫 APP API（www.cdnhth.cc 等）和图片
      # CDN 不通，就必须在这里配代理，否则网页能打开、能登录，但点下载会
      # 一直转圈或全部超时。
      #
      # 自测方法（在 NAS 上执行）：
      #   curl -sS -o /dev/null -w '%{http_code}\n' https://www.cdnhth.cc/
      #     无输出/超时 = 直连不通，需要配代理
      #     返回 200/403 = 通了
      #
      # ⚠ 别拿 18comic.vip 自测：那是网页版域名，返回的 403 是 Cloudflare
      #   JS 挑战，不代表 API 可用。
      #
      # 填宿主机代理地址。推荐用 host.docker.internal —— 下面的
      # extra_hosts 已把它映射到宿主机，换 NAS 或改 IP 时不用动配置。
      # 也可以直接写 NAS 的局域网 IP。
      #
      # ⚠ 不能写 127.0.0.1：容器里的 127.0.0.1 指向容器自身，不是宿主机。
      #
      # 留空 = 直连。
      HTTP_PROXY: "${JM_HTTP_PROXY:-}"
      HTTPS_PROXY: "${JM_HTTPS_PROXY:-}"
      http_proxy: "${JM_HTTP_PROXY:-}"
      https_proxy: "${JM_HTTPS_PROXY:-}"

      # ── 例外域名：走直连，绕开代理 ─────────────────────────────
      # 实测（2026-10-02）：mihomo 对 jm 系域名的转发失败
      #   www.cdnhth.cc       代理 000 / 直连 403 ✓
      #   cdn-msp2.jmapiproxy2.cc（图片 CDN）代理 000 / 直连 403 ✓
      # 图片 CDN 走代理必失败 → 会把图全下挂。故这些域名必须直连。
      # 其余站点（github、115 等）仍照常走代理。
      NO_PROXY: "${JM_NO_PROXY:-}"
      no_proxy: "${JM_NO_PROXY:-}"

    # 让容器内可以用 host.docker.internal 指向宿主机，
    # 这样代理地址写成 http://host.docker.internal:7890 即可，
    # 不必把 NAS 的局域网 IP 硬编码进 .env。
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # 配置 / 日志在容器内 /data 下。
      # 强烈建议绑到 NAS 的存储池（而不是默认的 docker 卷），
      # 这样日志是普通文件，方便快照、备份和直接读。
      - "${JM_DATA_PATH:-./data}:/data"

      # ── 漫画下载目录 ───────────────────────────────────────────────
      # 单独挂载，让下载产物直接落进后处理流水线扫描的源目录，
      # 实现「下载 → 打包 CBZ → 上传 115」全自动。
      #
      # 注意：jm 的下载目录应与 pica 分开，避免两套后处理脚本互相干扰。
      #
      # 需要把 config.json 里的 downloadDir 改成 /comic-download
      # （首次启动后改，或在网页「配置」里改）。
      #
      # 留空/注释掉则沿用 /data/漫画下载（不接后处理流水线）。
      - "${JM_COMIC_PATH:-./comic-download}:/comic-download"

      # ── jm 漫画元数据总库（候选池）─────────────────────────────────
      # /vol1/1000/databases 是三下载器（jm / pica / wnacg）共用的元数据卷。
      # jm.db 里 88 万本漫画的 download_state 全是 pending，从未被消费。
      # 挂进来后下载器自己完成「挑 pending → 下载 → 回写 done」这条链，
      # 不再依赖已全禁用的青龙脚本。
      #
      # 不能挂 :ro —— 回写 done 需要写权限。但代码里只 UPDATE
      # download_state 的 state/updated_at 两列，不碰爬虫的其它数据。
      - "${JM_DATABASES_PATH:-/vol1/1000/databases}:/databases"

    # 下载是 IO + 网络密集型，给足并发文件描述符
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # 让容器内的日志（含自动生成的 Token）不被 docker 截断
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
