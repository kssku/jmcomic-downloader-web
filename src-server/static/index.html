<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>jmcomic 下载后台</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   设计令牌：所有颜色 / 圆角 / 阴影集中于此，换主题只改这一段
   ═══════════════════════════════════════════════════════════════ */
:root {
  /* 底色改为带紫调的深蓝灰（非纯黑）：纯黑在长时间阅读下边界过硬，
     带一点紫调既贴合二次元皮肤，又不牺牲正文对比度 */
  --bg-0: #13111c;   /* 最底：页面背景 */
  --bg-1: #1a1726;   /* 卡片 */
  --bg-2: #211d30;   /* 卡片内嵌块 */
  --bg-3: #2a2539;   /* 悬停 / 轨道 */

  --border: #2e2941;
  --border-strong: #3d3654;

  --fg-0: #ece9f5;   /* 主文字 */
  --fg-1: #a9a2c0;   /* 次要文字 */
  --fg-2: #7a7391;   /* 弱化文字 */
  --fg-3: #565073;   /* 占位符 */

  /* 主色：低饱和粉紫。核心工作区（表格/日志/进度）仍用中性灰，
     此色只用于品牌、统计数字、焦点态等点缀位 */
  --accent: #c77dff;
  --accent-hover: #d59bff;
  --accent-dim: rgba(199, 125, 255, 0.14);

  /* 状态色柔和化：降低饱和度以贴合整体色调，同时保持可辨识度 */
  --success: #6ee7b7;
  --success-dim: rgba(110, 231, 183, 0.13);
  --warning: #fcd34d;
  --warning-dim: rgba(252, 211, 77, 0.13);
  --danger: #fb9db8;
  --danger-dim: rgba(251, 157, 184, 0.13);

  /* 圆角加大：6/10/14 → 8/14/20 */
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;

  /* 柔光替代硬阴影：紫调外发光，而非黑色投影 */
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.28), 0 8px 28px rgba(199, 125, 255, 0.07);
  --glow: 0 0 0 1px rgba(199, 125, 255, 0.18), 0 6px 24px rgba(199, 125, 255, 0.13);

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  background: var(--bg-0);
  color: var(--fg-0);
  -webkit-font-smoothing: antialiased;
}

/* 键盘焦点可见：仅键盘导航出现，不干扰鼠标 */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 5px;
  border: 2px solid var(--bg-0);
}
::-webkit-scrollbar-thumb:hover { background: #3d4859; }

/* ═══════════════════════════════════════════════════════════════
   布局骨架
   ═══════════════════════════════════════════════════════════════ */
/* 超宽屏下收窄：1680px 时左栏表单挤、右栏表格行过长，视线要来回扫 */
.shell { max-width: 1440px; margin: 0 auto; padding: 0 24px 48px; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 0;
  margin-bottom: 22px;
  background: rgba(19, 17, 28, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: 11px;
  background: linear-gradient(135deg, #c77dff, #7c5cff);
  box-shadow: 0 4px 14px rgba(199, 125, 255, 0.3);
  font-size: 15px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.brand-text h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.brand-text p { margin: 0; font-size: 11px; color: var(--fg-2); }

.conn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px; font-weight: 500;
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--fg-1);
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}
.conn .led { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); flex-shrink: 0; }
.conn[data-state="live"] { color: var(--success); border-color: rgba(52,211,153,0.3); background: var(--success-dim); }
.conn[data-state="live"] .led { background: var(--success); animation: pulse 2s ease-in-out infinite; }
.conn[data-state="down"] { color: var(--danger); border-color: rgba(248,113,113,0.3); background: var(--danger-dim); }
.conn[data-state="down"] .led { background: var(--danger); }
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(0.8); }
}
.spacer { flex: 1; }

/* ═══════════════════════════════════════════════════════════════
   控件
   ═══════════════════════════════════════════════════════════════ */
button {
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 7px 14px;
  border-radius: var(--r-sm);
  border: 1px solid transparent;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, opacity 0.15s, color 0.15s;
  white-space: nowrap;
}
button:hover:not(:disabled) { background: var(--accent-hover); }
button:disabled { opacity: 0.45; cursor: not-allowed; }

button.ghost {
  background: var(--bg-2);
  border-color: var(--border);
  color: var(--fg-1);
}
button.ghost:hover:not(:disabled) { background: var(--bg-3); border-color: var(--border-strong); color: var(--fg-0); }

button.sm { padding: 4px 10px; font-size: 12px; }

button.icon {
  padding: 3px 9px;
  font-size: 12px;
  background: transparent;
  border-color: var(--border);
  color: var(--fg-1);
}
button.icon:hover:not(:disabled) { background: var(--bg-3); color: var(--fg-0); }
button.icon.danger:hover:not(:disabled) {
  background: var(--danger-dim);
  border-color: rgba(248, 113, 113, 0.4);
  color: var(--danger);
}

input[type="text"], input[type="number"], textarea, select {
  font: inherit;
  font-size: 13px;
  width: 100%;
  padding: 8px 11px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: var(--bg-1);
  color: var(--fg-0);
  transition: border-color 0.15s, background 0.15s;
}
input:hover, textarea:hover, select:hover { border-color: var(--border-strong); }
input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--bg-2);
}
input::placeholder, textarea::placeholder { color: var(--fg-3); }
textarea {
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.75;
  resize: vertical;
  min-height: 100px;
}
input[type="checkbox"] { accent-color: var(--accent); width: auto; }
/* 窄输入框（如「清理 N 天前」的 N），避免行内硬编码宽度 */
.input-xs { width: 68px; }

/* ═══════════════════════════════════════════════════════════════
   卡片 / 分栏
   ═══════════════════════════════════════════════════════════════ */
/* 布局范式：顶部 KPI 通栏 → 中部操作卡网格 → 底部表格/日志通栏
   旧版「左窄列 + 右宽列」实测左列 2501px、右列 696px，高度差 3.6 倍，
   滚动时右半边出现大片空白 —— 这才是「又挤又空」的真正根因，
   单纯调列宽数字无法解决，故改为分层通栏结构 */
.layout {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* 操作卡区：自适应网格，窄屏 1 列、中屏 2 列、宽屏 3 列 */
.ops-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
  align-items: start;
}
/* 单行本导出含导出列表，让它跨满整行避免列表被压窄 */
.ops-grid > .card:nth-child(3) { grid-column: 1 / -1; }

/* 底部工作区：任务表 + 事件日志并排，宽屏下日志占 1/3 */
.work-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(300px, 380px);
  gap: 20px;
  align-items: start;
}
@media (max-width: 1180px) {
  .work-grid { grid-template-columns: minmax(0, 1fr); }
}

.card {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  box-shadow: var(--shadow);
  transition: border-color 0.18s;
}
.card:hover { border-color: var(--border-strong); }
.card > h2 {
  margin: 0 0 16px;
  /* 中文无大小写：原先 uppercase + letter-spacing 只留下被拉散的字距，
     反而显得松散；改用字号/字重/颜色建立层级 */
  font-size: 13px;
  font-weight: 600;
  color: var(--fg-0);
  letter-spacing: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card > h2::before {
  content: '';
  width: 3px; height: 14px;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--accent), #7c5cff);
  flex-shrink: 0;
}

.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
/* 与上方内容拉开一档间距（替代原先散落的 inline margin-top:14px） */
.row-gap { margin-top: 16px; }

.field { margin-bottom: 12px; }
.field:last-child { margin-bottom: 0; }
.field > label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--fg-1);
  margin-bottom: 5px;
}
.hint { font-size: 11.5px; color: var(--fg-2); line-height: 1.5; margin-top: 6px; }
.muted { color: var(--fg-2); font-size: 12px; }

/* ═══════════════════════════════════════════════════════════════
   统计
   ═══════════════════════════════════════════════════════════════ */
.stats {
  display: grid;
  /* 统计通栏后容器宽度充足：固定 5 列，消灭原先「4 列装 5 格、
     第 5 格掉到第二行」的孤行问题 */
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
}
@media (max-width: 900px) {
  .stats { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
}
.stat {
  padding: 14px 12px;
  border-radius: var(--r-md);
  background: var(--bg-2);
  border: 1px solid var(--border);
  text-align: center;
  transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
}
.stat:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: var(--glow); }
.stat .n {
  display: block;
  font-size: 24px;
  font-weight: 700;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
  /* 渐变文字（token 层风格表达，不影响可读性） */
  background: linear-gradient(135deg, var(--fg-0), var(--accent));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.stat .k {
  display: block;
  font-size: 11px;
  color: var(--fg-2);
  margin-top: 3px;
  letter-spacing: 0.03em;
}
/* 有色调的统计格：保持实色，避免与渐变叠加后对比度下降 */
.stat[data-tone="active"] .n { background: none; color: var(--accent); -webkit-text-fill-color: var(--accent); }
.stat[data-tone="ok"] .n     { background: none; color: var(--success); -webkit-text-fill-color: var(--success); }
.stat[data-tone="warn"] .n   { background: none; color: var(--warning); -webkit-text-fill-color: var(--warning); }
.stat[data-tone="bad"] .n    { background: none; color: var(--danger); -webkit-text-fill-color: var(--danger); }

/* ═══════════════════════════════════════════════════════════════
   状态徽章
   ═══════════════════════════════════════════════════════════════ */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 500;
  white-space: nowrap;
  border: 1px solid transparent;
}
.badge::before {
  content: '';
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}
.badge[data-s="pending"]     { background: var(--bg-3); color: var(--fg-1); border-color: var(--border-strong); }
.badge[data-s="downloading"] { background: var(--accent-dim); color: #8fb0ff; border-color: rgba(79,124,255,0.3); }
.badge[data-s="downloading"]::before { animation: pulse 1.4s ease-in-out infinite; }
.badge[data-s="paused"]      { background: var(--warning-dim); color: var(--warning); border-color: rgba(251,191,36,0.3); }
.badge[data-s="completed"]   { background: var(--success-dim); color: var(--success); border-color: rgba(52,211,153,0.3); }
.badge[data-s="failed"]      { background: var(--danger-dim); color: var(--danger); border-color: rgba(248,113,113,0.3); }
.badge[data-s="cancelled"]   { background: var(--bg-3); color: var(--fg-2); border-color: var(--border); }

/* ═══════════════════════════════════════════════════════════════
   进度条
   ═══════════════════════════════════════════════════════════════ */
.progress { display: flex; align-items: center; gap: 8px; min-width: 140px; }
.track {
  flex: 1;
  height: 6px;
  min-width: 60px;
  border-radius: 3px;
  background: var(--bg-3);
  overflow: hidden;
}
.track > i {
  display: block;
  height: 100%;
  border-radius: 3px;
  background: var(--accent);
  transition: width 0.3s ease;
}
.track > i[data-s="completed"] { background: var(--success); }
.track > i[data-s="failed"]    { background: var(--danger); }
.track > i[data-s="paused"]    { background: var(--warning); }
.pct {
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  color: var(--fg-1);
  min-width: 46px;
  text-align: right;
}

/* ═══════════════════════════════════════════════════════════════
   表格
   ═══════════════════════════════════════════════════════════════ */
/* 去掉负边距溢出 hack：它让 sticky 表头的水平滚动基准错位，
   滚动时左右内容还会贴边。改为容器内滚动，纵向留出表头空间 */
.table-wrap {
  overflow-x: auto;
  overflow-y: visible;
  margin: 0;
  padding: 0;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
/* 列宽约束：原先长文本列无上限，整行被拉到 1000px+，视线要横跨整屏 */
th:nth-child(1), td:nth-child(1) { width: 38px; }
th:nth-child(2), td:nth-child(2) { width: auto; }      /* 漫画/章节：吃掉剩余 */
th:nth-child(3), td:nth-child(3) { width: 104px; }     /* 状态 */
th:nth-child(4), td:nth-child(4) { width: 170px; }     /* 进度 */
th:nth-child(5), td:nth-child(5) { width: 64px; }      /* 重试 */
th:nth-child(6), td:nth-child(6) { width: 210px; }     /* 操作 */
th {
  /* 表格在 .table-wrap 内横向滚动，且卡片本身不滚动，
     故 sticky top 无有效参照 —— 去掉，避免产生「半粘住」的错觉 */
  text-align: left;
  font-size: 12px;
  font-weight: 600;
  color: var(--fg-1);
  letter-spacing: 0;
  padding: 9px 12px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border-strong);
  white-space: nowrap;
}
td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
tbody tr { transition: background 0.12s; }
tbody tr:hover { background: var(--bg-2); }
tbody tr:last-child td { border-bottom: none; }

.cell-title {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--fg-0);
  font-weight: 500;
}
.cell-sub {
  font-size: 11.5px;
  color: var(--fg-2);
  font-family: var(--mono);
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: 2px;
}
.cell-num { font-variant-numeric: tabular-nums; color: var(--fg-1); }
/* 列宽已由 th:nth-child 统一控制，此处只留对齐与内边距 */
.cell-check { padding-left: 14px; padding-right: 0; text-align: left; }
.cell-check input { margin: 0; cursor: pointer; }
tr:has(.row-check:checked) { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.cell-actions { display: flex; gap: 6px; flex-wrap: nowrap; }

.empty { padding: 56px 20px; text-align: center; color: var(--fg-2); }
.empty-icon { font-size: 30px; opacity: 0.28; margin-bottom: 12px; line-height: 1; }

/* ═══════════════════════════════════════════════════════════════
   过滤标签页
   ═══════════════════════════════════════════════════════════════ */
.tabs {
  display: flex;
  align-items: center;
  gap: 2px;
  margin: 0 0 14px;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  background: transparent;
  color: var(--fg-2);
  border: none;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  padding: 9px 12px;
  font-size: 13px;
  font-weight: 500;
  transition: color 0.15s, border-color 0.15s;
}
.tabs button:hover:not(:disabled) { color: var(--fg-0); background: transparent; }
.tabs button.active { color: var(--fg-0); border-bottom-color: var(--accent); }
.tabs .count {
  font-size: 11px;
  color: var(--fg-3);
  margin-left: 5px;
  font-variant-numeric: tabular-nums;
}
.tabs button.active .count { color: var(--accent); }
.tabs .filter-input { width: 150px; margin-bottom: 8px; flex-shrink: 0; padding: 6px 10px; }

/* ═══════════════════════════════════════════════════════════════
   日志
   ═══════════════════════════════════════════════════════════════ */
.log {
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.7;
  background: var(--bg-0);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px 14px;
  height: 230px;
  overflow-y: auto;
  color: var(--fg-1);
}
.log-line { display: flex; gap: 9px; }
.log-line + .log-line { margin-top: 1px; }
.log-ts { color: var(--fg-3); flex-shrink: 0; font-variant-numeric: tabular-nums; }
.log-msg { min-width: 0; word-break: break-word; }
.log-line[data-k="ok"] .log-msg   { color: var(--success); }
.log-line[data-k="err"] .log-msg  { color: var(--danger); }
.log-line[data-k="warn"] .log-msg { color: var(--warning); }
.log-line[data-k="info"] .log-msg { color: #8fb0ff; }

/* ═══════════════════════════════════════════════════════════════
   Toast
   ═══════════════════════════════════════════════════════════════ */
/* ══ 导出列表 ══ */
.export-list { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.export-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 11px;
  border-radius: var(--r-md);
  background: var(--bg-2);
  border: 1px solid var(--border);
  font-size: 12.5px;
  transition: border-color 0.15s;
}
.export-item:hover { border-color: var(--border-strong); }
.export-item .fname {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--fg-0);
}
.export-item .fmeta {
  flex-shrink: 0;
  color: var(--fg-2);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}
.export-list .empty { padding: 20px; }

.toasts {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 220px;
  max-width: 380px;
  padding: 11px 14px;
  border-radius: var(--r-md);
  background: var(--bg-2);
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow);
  font-size: 13px;
  color: var(--fg-0);
  animation: slideIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}
.toast[data-k="ok"]   { border-left: 3px solid var(--success); }
.toast[data-k="err"]  { border-left: 3px solid var(--danger); }
.toast[data-k="warn"] { border-left: 3px solid var(--warning); }
.toast[data-k="info"] { border-left: 3px solid var(--accent); }
@keyframes slideIn {
  from { opacity: 0; transform: translateX(16px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ═══════════════════════════════════════════════════════════════
   无障碍 / 动效偏好
   ═══════════════════════════════════════════════════════════════ */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">J</div>
      <div class="brand-text">
        <h1>jmcomic 下载后台</h1>
        <p>纯 API 调度控制台</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="conn" id="conn" data-state="connecting" role="status" aria-live="polite">
      <span class="led" aria-hidden="true"></span>
      <span id="conn-text">连接中</span>
    </div>
    <button class="ghost sm" onclick="refreshAll()">刷新全部</button>
  </header>

  <!-- 顶层：统计 KPI 通栏（原先挤在左列底部，5 格被压成 4 列 + 孤行） -->
  <section class="card">
    <h2>任务统计</h2>
    <div class="stats" id="stats"></div>
    <div class="row row-gap">
      <label for="purge-days" class="muted">清理</label>
      <input id="purge-days" type="text" inputmode="numeric" value="30"
             class="input-xs" aria-describedby="purge-msg">
      <span class="muted">天前的终态任务</span>
      <button class="ghost sm" id="btn-purge" onclick="purgeTasks()">清理</button>
      <span class="muted" id="purge-msg" aria-live="polite"></span>
    </div>
  </section>

  <!-- 操作卡区：自适应 1/2/3 列网格，取代原先竖着堆成 2501px 的窄列 -->
  <div class="ops-grid">

      <section class="card">
        <h2>批量投递</h2>
        <div class="field">
          <label for="batch-ids">漫画 ID 列表</label>
          <textarea id="batch-ids" spellcheck="false"
            placeholder="每行一个，也支持逗号 / 空格分隔&#10;1461316&#10;1469067&#10;1435947"
            aria-describedby="batch-hint"></textarea>
          <p class="hint" id="batch-hint">非数字内容会被自动忽略，重复 ID 只投递一次</p>
        </div>
        <div class="field">
          <label for="batch-chapter">章节 ID（可选）</label>
          <input type="text" id="batch-chapter" spellcheck="false" placeholder="留空则下载整本未下载章节" />
        </div>
        <div class="row">
          <button id="btn-batch" onclick="submitBatch()">开始投递</button>
          <button class="ghost" onclick="clearBatch()">清空</button>
          <div class="spacer"></div>
          <span class="muted" id="batch-count" aria-live="polite"></span>
        </div>
      </section>

      <section class="card">
        <h2>单个投递</h2>
        <div class="field">
          <label for="one-comic">漫画 ID</label>
          <input type="text" id="one-comic" spellcheck="false" placeholder="1461316" />
        </div>
        <div class="field">
          <label for="one-chapter">章节 ID（可选）</label>
          <input type="text" id="one-chapter" spellcheck="false" placeholder="留空下载整本" />
        </div>
        <button onclick="submitOne()">投递</button>
      </section>

      <section class="card">
        <h2>单行本导出</h2>
        <div class="field">
          <label for="export-comic">漫画 ID</label>
          <input type="text" id="export-comic" spellcheck="false" placeholder="1461316" />
          <p class="hint">把整本已下载的全部章节合成一个 CBZ。缺章会被拒绝并提示还差几章。</p>
        </div>
        <div class="row">
          <button id="btn-export" onclick="exportComic()">合成单行本</button>
          <button class="ghost" onclick="loadExports()">刷新列表</button>
          <div class="spacer"></div>
          <span class="muted" id="export-msg" aria-live="polite"></span>
        </div>
        <div id="export-list" class="export-list"></div>
      </section>

      <section class="card">
        <h2>运行配置</h2>
        <div id="config-fields"></div>
        <div class="row row-gap">
          <button onclick="saveConfig()">保存</button>
          <button class="ghost" onclick="loadConfig()">重新载入</button>
        </div>
      </section>

  </div>

  <!-- 工作区：任务表（通栏主体）+ 事件日志（右侧），取代原先右列 696px 的短柱 -->
  <div class="work-grid">

      <section class="card">
        <div class="tabs" role="tablist" id="tabs">
          <button class="active" data-state="" role="tab" aria-selected="true" onclick="setFilter(this, '')">全部<span class="count" id="c-all"></span></button>
          <button data-state="downloading" role="tab" aria-selected="false" onclick="setFilter(this, 'downloading')">下载中<span class="count" id="c-downloading"></span></button>
          <button data-state="pending" role="tab" aria-selected="false" onclick="setFilter(this, 'pending')">等待<span class="count" id="c-pending"></span></button>
          <button data-state="paused" role="tab" aria-selected="false" onclick="setFilter(this, 'paused')">暂停<span class="count" id="c-paused"></span></button>
          <button data-state="completed" role="tab" aria-selected="false" onclick="setFilter(this, 'completed')">已完成<span class="count" id="c-completed"></span></button>
          <button data-state="failed" role="tab" aria-selected="false" onclick="setFilter(this, 'failed')">失败<span class="count" id="c-failed"></span></button>
          <div class="spacer"></div>
          <input type="text" id="filter-comic" class="filter-input" spellcheck="false"
                 placeholder="按漫画 ID 过滤" oninput="onFilterInput()" aria-label="按漫画 ID 过滤" />
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col" class="cell-check">
                  <input type="checkbox" id="check-all" aria-label="全选当前页">
                </th>
                <th scope="col">漫画 / 章节</th>
                <th scope="col">状态</th>
                <th scope="col">进度</th>
                <th scope="col">重试</th>
                <th scope="col">操作</th>
              </tr>
            </thead>
            <tbody id="task-rows"></tbody>
          </table>
        </div>

        <div class="row row-gap">
          <span class="muted" id="task-total"></span>
          <div class="spacer"></div>
          <button class="ghost sm danger" id="btn-bulk-delete" disabled
                  onclick="deleteSelected()">删除选中<span id="bulk-count"></span></button>
          <button class="ghost sm" id="btn-prev" onclick="pagePrev()">上一页</button>
          <span class="muted" id="page-info">1</span>
          <button class="ghost sm" id="btn-next" onclick="pageNext()">下一页</button>
        </div>
      </section>

      <section class="card">
        <h2>事件日志</h2>
        <div class="log" id="log" role="log" aria-live="polite" aria-label="事件日志"></div>
      </section>

  </div>

</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   常量与状态
   ═══════════════════════════════════════════════════════════════ */
const PAGE_SIZE = 50;

const STATE_LABEL = {
  pending: '等待',
  downloading: '下载中',
  paused: '暂停',
  completed: '已完成',
  failed: '失败',
  cancelled: '已取消',
};

/* 配置字段的中文标签。键必须与后端 `Config`（src-server/src/config.rs）
   序列化后的 camelCase 字段名逐一对齐 —— 漏一个，界面上就会露出英文键名。
   test-config-labels.cjs 会解析 config.rs 做契约校验，防止后端加字段后脱节。 */
const CONFIG_LABELS = {
  baseDir: '保存目录',
  exportDir: '导出目录',
  dirFmt: '目录格式',
  downloadFormat: '下载格式',
  enableFileLogger: '文件日志',
  shouldDownloadCover: '下载封面',
  autoExportCbz: '自动导出 CBZ',
  catalogAutoFill: '候选池自动补全',
  catalogFillBatch: '候选池每轮上限',
  apiBaseUrl: 'API 地址',
  proxyMode: '代理模式',
  proxyHost: '代理主机',
  proxyPort: '代理端口',
  chapterConcurrency: '章节并发',
  chapterDownloadIntervalSec: '章节间隔（秒）',
  imgConcurrency: '图片并发',
  imgDownloadIntervalSec: '图片间隔（秒）',
};

/* 不渲染到配置面板的键：敏感项（CONFIG_SKIP）或只读项。 */
const CONFIG_SKIP = new Set(['token', 'username', 'password']);

const state = {
  filterState: '',
  filterComic: '',
  pageOffset: 0,
  totalTasks: 0,
  tasks: [],
  config: null,
  ws: null,
  wsRetry: 0,
  // WS 是否处于已连接状态。连接期间事件会主动推送，轮询兜底只在
  // 断开时才有意义 —— 否则 WS 连着还每 15 秒打一次 /api/tasks/stats。
  wsLive: false,
  stats: null,
  filterTimer: null,
  // 请求序号：`loadTasks` 可能被筛选、翻页、WS 事件并发触发，
  // 用单调递增的序号丢弃过期响应，避免先发后到的旧数据覆盖新数据。
  loadSeq: 0,
  // 已勾选待批量删除的 chapterId。用 Set 而非数组，避免重复添加。
  // 翻页/筛选后列表会变，但勾选状态保留——这是刻意的，
  // 用户可以先在第一页勾几个、翻页再勾几个，最后一次性删。
  selectedIds: new Set(),
};

/* ═══════════════════════════════════════════════════════════════
   基础工具
   ═══════════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function ts() {
  return new Date().toLocaleTimeString('zh-CN', { hour12: false });
}

/* 统一 API 调用：自动 JSON、自动抛错、错误信息优先取后端字段 */
async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) {
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body);
  }
  const res = await fetch(path, opt);
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
  if (!res.ok) {
    const raw = (data && (data.error || data.message)) || `${res.status} ${res.statusText}`;
    throw new Error(typeof raw === 'string' ? raw : JSON.stringify(raw));
  }
  return data;
}

/* ═══════════════════════════════════════════════════════════════
   日志与 Toast
   ═══════════════════════════════════════════════════════════════ */
/* 日志行数上限。用计数器跟踪，避免每追加一行都做一次
   childElementCount（它是会遍历子节点的 DOM 查询，高频 WS 事件下是 O(n) 叠加）。 */
const LOG_MAX = 400;
let logCount = 0;

function log(msg, kind = '') {
  const el = $('log');
  const line = document.createElement('div');
  line.className = 'log-line';
  if (kind) line.dataset.k = kind;
  line.innerHTML = `<span class="log-ts">${ts()}</span><span class="log-msg">${esc(msg)}</span>`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;

  if (++logCount > LOG_MAX) {
    // 一次裁剪掉超出部分，而不是每行只删一个。外部清空过 #log 时
    // childElementCount 会小于计数，用最小长度兜底，避免 removeChild(null)。
    const excess = logCount - LOG_MAX;
    for (let i = 0; i < excess && el.firstChild; i++) el.removeChild(el.firstChild);
    logCount = el.childElementCount;
  }
}

function toast(msg, kind = 'info', ms = 3200) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.dataset.k = kind;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .2s, transform .2s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(16px)';
    setTimeout(() => el.remove(), 220);
  }, ms);
}

/* ═══════════════════════════════════════════════════════════════
   批量投递
   ═══════════════════════════════════════════════════════════════ */
function parseIds(raw) {
  return raw.split(/[\n,\s]+/).map((s) => s.trim()).filter((s) => /^\d+$/.test(s));
}

function uniqIds(raw) {
  return [...new Set(parseIds(raw))];
}

function clearBatch() {
  $('batch-ids').value = '';
  $('batch-chapter').value = '';
  $('batch-count').textContent = '';
}

$('batch-ids').addEventListener('input', () => {
  const n = uniqIds($('batch-ids').value).length;
  $('batch-count').textContent = n ? `${n} 个 ID` : '';
});

async function submitBatch() {
  const ids = uniqIds($('batch-ids').value);
  if (ids.length === 0) { toast('没有解析到有效漫画 ID', 'warn'); log('批量投递中止：无有效 ID', 'warn'); return; }

  const chapterId = $('batch-chapter').value.trim() || null;
  const btn = $('btn-batch');
  btn.disabled = true;
  btn.textContent = '投递中…';
  log(`开始批量投递 ${ids.length} 个漫画`, 'info');

  let ok = 0, fail = 0, created = 0;
  for (const id of ids) {
    try {
      const body = { comicId: id };
      if (chapterId) body.chapterId = chapterId;
      const r = await api('POST', '/api/download/by-id', body);
      created += (r && r.createdCount) || 0;
      ok++;
      log(`✓ ${id} 新建 ${r.createdCount || 0} 个章节任务`, 'ok');
    } catch (e) {
      fail++;
      log(`✗ ${id} ${e.message}`, 'err');
    }
  }

  btn.disabled = false;
  btn.textContent = '开始投递';
  const summary = `批量完成：成功 ${ok} / 失败 ${fail}，共新建 ${created} 个章节任务`;
  log(summary, fail === 0 ? 'ok' : 'warn');
  toast(summary, fail === 0 ? 'ok' : 'warn');
  await refreshAll();
}

/* ═══════════════════════════════════════════════════════════════
   单个投递
   ═══════════════════════════════════════════════════════════════ */
async function submitOne() {
  const comicId = $('one-comic').value.trim();
  if (!/^\d+$/.test(comicId)) { toast('请输入纯数字漫画 ID', 'warn'); return; }

  const chapterId = $('one-chapter').value.trim() || null;
  const body = { comicId };
  if (chapterId) body.chapterId = chapterId;

  try {
    const r = await api('POST', '/api/download/by-id', body);
    const msg = `✓ ${r.comicTitle || comicId} 新建 ${r.createdCount || 0} 个章节任务`;
    log(msg, 'ok');
    toast(msg, 'ok');
    await refreshAll();
  } catch (e) {
    log(`✗ 投递失败：${e.message}`, 'err');
    toast(`投递失败：${e.message}`, 'err');
  }
}

/* ═══════════════════════════════════════════════════════════════
   任务列表
   ═══════════════════════════════════════════════════════════════ */
function buildQuery() {
  const p = new URLSearchParams();
  p.set('limit', String(PAGE_SIZE));
  p.set('offset', String(state.pageOffset));
  if (state.filterState) p.set('state', state.filterState);
  if (state.filterComic) p.set('comicId', state.filterComic);
  return p.toString();
}

async function loadTasks() {
  const seq = ++state.loadSeq;
  try {
    const r = await api('GET', `/api/tasks?${buildQuery()}`);
    // 期间又有新的请求发出（翻页 / 改筛选 / WS 事件触发），本次结果已过期。
    if (seq !== state.loadSeq) return;
    state.tasks = r.tasks || [];
    state.totalTasks = r.total ?? state.tasks.length;
    // 别处删掉的任务要清出勾选集合，否则计数虚高、批量删除会发向不存在的 id。
    // 必须在 renderTasks 之前跑：syncSelection 依赖已清理过的集合来算计数。
    pruneSelection();
    renderTasks();
  } catch (e) {
    if (seq !== state.loadSeq) return;
    log(`加载任务失败：${e.message}`, 'err');
    // 失败时不能停在旧内容上——那样用户会以为「就是这些任务」。
    // 清空并显式报错，与「真的没有匹配任务」区分开（见 loadExports 的做法）。
    state.tasks = [];
    state.totalTasks = 0;
    renderTasksError(e.message);
  }
}

/* 任务列表渲染失败态。与 renderTasks 的空态区分：
   空态是「查到了，但没有」，这里是「没查到，因为出错了」。 */
function renderTasksError(message) {
  $('task-rows').innerHTML = `
    <tr><td colspan="6">
      <div class="empty">
        <div class="empty-icon" aria-hidden="true">⚠️</div>
        <div>任务列表加载失败</div>
        <div class="empty-text">${esc(message)}</div>
      </div>
    </td></tr>`;
  $('task-total').textContent = '';
  $('page-info').textContent = '';
  $('btn-prev').disabled = true;
  $('btn-next').disabled = true;
  // 失败态下页码已不可信：若停在越界 offset，切回筛选时会带着它请求，
  // 后端返回空列表，用户会误以为「筛选后没有任务」。归零让下次从第一页开始。
  state.pageOffset = 0;
  state.totalTasks = 0;
}

function renderTasks() {
  const rows = $('task-rows');
  if (state.tasks.length === 0) {
    rows.innerHTML = `
      <tr><td colspan="6">
        <div class="empty">
          <div class="empty-icon" aria-hidden="true">📭</div>
          <div>没有匹配的任务</div>
        </div>
      </td></tr>`;
  } else {
    rows.innerHTML = state.tasks.map((t) => {
      const st = t.state || 'pending';
      const label = STATE_LABEL[st] || st;
      const pct = typeof t.progress === 'number' ? t.progress : 0;
      // 动作按钮不内联 onclick：chapterId 是任意 String（后端无格式约束），
      // 而 esc() 只转 HTML 实体、不做 JS 字符串转义——
      // `'` 会变成 `&#39;`，浏览器解析属性时又还原成 `'`，从而闭合字面量逃逸。
      // 改为 data-* 传值 + 事件委托，值只经 dataset 读取，不进 JS 源码。
      const actions = [];
      const btn = (act, text, cls = 'icon') =>
        `<button class="${cls}" data-act="${act}" data-cid="${esc(t.chapterId)}">${text}</button>`;

      if (st === 'downloading') actions.push(btn('pause', '暂停'));
      if (st === 'paused') actions.push(btn('resume', '继续'));
      if (st === 'failed' || st === 'cancelled') actions.push(btn('retry', '重试'));
      if (st === 'downloading' || st === 'pending' || st === 'paused') actions.push(btn('cancel', '取消'));
      actions.push(btn('delete', '删除', 'icon danger'));

      const checked = state.selectedIds.has(t.chapterId) ? ' checked' : '';
      return `
        <tr>
          <td class="cell-check">
            <input type="checkbox" class="row-check" data-cid="${esc(t.chapterId)}"
                   aria-label="选择此任务"${checked}>
          </td>
          <td>
            <div class="cell-title" title="${esc(t.comicTitle)}">${esc(t.comicTitle || '—')}</div>
            <div class="cell-sub" title="${esc(t.chapterTitle)}">${esc(t.chapterTitle || t.chapterId || '')}</div>
          </td>
          <td><span class="badge" data-s="${esc(st)}">${esc(label)}</span></td>
          <td>
            <div class="progress">
              <div class="track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
                <i data-s="${esc(st)}" style="width:${Math.min(100, Math.max(0, pct))}%"></i>
              </div>
              <span class="pct">${t.doneImgCount ?? 0}/${t.totalImgCount ?? 0}</span>
            </div>
          </td>
          <td class="cell-num">${t.retryCount ?? 0}</td>
          <td><div class="cell-actions">${actions.join('')}</div></td>
        </tr>`;
    }).join('');
  }

  /* `state.totalTasks` 是**当前筛选下**的总数（来自分页 API 的 total），
     而标签页上的 `c-*` 计数是**全局**统计（来自 /api/tasks/stats）。
     两者不同源，同一屏并列会出现「失败 3」配「共 12 条」的歧义。
     有筛选时把口径写明；无筛选时二者等价，保持原样。 */
  if (state.totalTasks) {
    const filtered = state.filterState || state.filterComic;
    $('task-total').textContent = filtered
      ? `当前筛选 ${state.totalTasks} 条`
      : `共 ${state.totalTasks} 条`;
  } else {
    $('task-total').textContent = '';
  }
  const page = Math.floor(state.pageOffset / PAGE_SIZE) + 1;
  const pages = Math.max(1, Math.ceil(state.totalTasks / PAGE_SIZE));
  $('page-info').textContent = `第 ${page} / ${pages} 页`;
  $('btn-prev').disabled = state.pageOffset === 0;
  $('btn-next').disabled = state.pageOffset + PAGE_SIZE >= state.totalTasks;
  syncSelection();
}

/* ═══════════════════════════════════════════════════════════════
   批量选择
   ═══════════════════════════════════════════════════════════════ */

/* 把选中态同步到 DOM：行勾选、表头全选、批量按钮。
   三个入口（翻页、筛选、单条勾选）都调它，避免各自算各自的分叉。 */
function syncSelection() {
  const boxes = [...document.querySelectorAll('.row-check')];
  let n = 0;
  for (const b of boxes) {
    const on = state.selectedIds.has(b.dataset.cid);
    b.checked = on;
    if (on) n++;
  }
  const all = $('check-all');
  if (all) {
    all.checked = boxes.length > 0 && n === boxes.length;
    all.indeterminate = n > 0 && n < boxes.length;
    all.disabled = boxes.length === 0;
  }
  const btn = $('btn-bulk-delete');
  if (btn) btn.disabled = n === 0;
  const cnt = $('bulk-count');
  if (cnt) cnt.textContent = n ? `（${n}）` : '';
}

/* 勾选态跨页保留：chapterId 是全局唯一的，翻页后不该丢。
   但已经被删掉的任务要清出集合，否则计数会虚高。 */
function pruneSelection() {
  const live = new Set(state.tasks.map((t) => t.chapterId));
  for (const id of [...state.selectedIds]) {
    if (!live.has(id)) state.selectedIds.delete(id);
  }
}

async function deleteSelected() {
  const ids = [...state.selectedIds];
  if (!ids.length) return;
  if (!confirm(`确认删除选中的 ${ids.length} 条任务？此操作不可撤销。`)) return;

  const btn = $('btn-bulk-delete');
  if (btn) btn.disabled = true;

  // 逐条发：后端只有单条 DELETE，没有批量端点。
  // 用 allSettled 而非 all —— 一条失败不该让其余成功的结果被当成整体失败，
  // 否则用户看到「删除失败」却不知道其实删掉了 9 条。
  const results = await Promise.allSettled(
    ids.map((id) => api('DELETE', `/api/tasks/${encodeURIComponent(id)}`)),
  );
  const ok = results.filter((r) => r.status === 'fulfilled').length;
  const fail = results.length - ok;

  state.selectedIds.clear();
  if (fail === 0) {
    log(`已删除 ${ok} 条任务`, 'ok');
    toast(`已删除 ${ok} 条`, 'ok');
  } else {
    const firstErr = results.find((r) => r.status === 'rejected')?.reason;
    log(`删除完成：成功 ${ok} 条，失败 ${fail} 条（${firstErr?.message ?? '未知错误'}）`, 'err');
    toast(`成功 ${ok} 条，失败 ${fail} 条`, 'err');
  }
  await refreshAll();
}

function setFilter(btn, st) {
  state.filterState = st;
  state.pageOffset = 0;
  document.querySelectorAll('#tabs button[data-state]').forEach((b) => {
    const on = b === btn;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', String(on));
  });
  loadTasks();
}

function onFilterInput() {
  clearTimeout(state.filterTimer);
  state.filterTimer = setTimeout(() => {
    state.filterComic = $('filter-comic').value.trim();
    state.pageOffset = 0;
    loadTasks();
  }, 300);
}

function pagePrev() {
  if (state.pageOffset >= PAGE_SIZE) { state.pageOffset -= PAGE_SIZE; loadTasks(); }
}
function pageNext() {
  if (state.pageOffset + PAGE_SIZE < state.totalTasks) { state.pageOffset += PAGE_SIZE; loadTasks(); }
}

/* ═══════════════════════════════════════════════════════════════
   任务操作
   ═══════════════════════════════════════════════════════════════ */
async function taskAction(chapterId, action) {
  try {
    await api('POST', `/api/download/task/${encodeURIComponent(chapterId)}/${action}`, {});
    log(`${action} ${chapterId} 成功`, 'ok');
    await loadTasks();
  } catch (e) {
    log(`${action} 失败：${e.message}`, 'err');
    toast(`${action} 失败：${e.message}`, 'err');
  }
}

async function retryTask(chapterId) {
  try {
    const r = await api('POST', `/api/tasks/${encodeURIComponent(chapterId)}/retry`, {});
    const msg = `重试 ${chapterId}：重置 ${r.resetImgCount ?? 0} 张，剩 ${r.unfinishedImgCount ?? 0} 张`;
    log(msg, 'ok');
    toast(msg, 'ok');
    await loadTasks();
  } catch (e) {
    log(`重试失败：${e.message}`, 'err');
    toast(`重试失败：${e.message}`, 'err');
  }
}

async function deleteTask(chapterId) {
  if (!confirm(`确认删除任务 ${chapterId}？此操作不可撤销。`)) return;
  try {
    await api('DELETE', `/api/tasks/${encodeURIComponent(chapterId)}`);
    log(`已删除 ${chapterId}`, 'ok');
    await refreshAll();
  } catch (e) {
    log(`删除失败：${e.message}`, 'err');
    toast(`删除失败：${e.message}`, 'err');
  }
}

/* ═══════════════════════════════════════════════════════════════
   统计与清理
   ═══════════════════════════════════════════════════════════════ */
const STAT_SPEC = [
  ['total', '总任务', ''],
  ['downloading', '下载中', 'active'],
  ['pending', '等待', ''],
  ['paused', '暂停', 'warn'],
  ['completed', '完成', 'ok'],
  ['failed', '失败', 'bad'],
  ['cancelled', '取消', ''],
];

async function loadStats() {
  try {
    const s = await api('GET', '/api/tasks/stats');
    state.stats = s;
    $('stats').innerHTML = STAT_SPEC.map(([key, label, tone]) => `
      <div class="stat"${tone ? ` data-tone="${tone}"` : ''}>
        <span class="n">${s[key] ?? 0}</span>
        <span class="k">${label}</span>
      </div>`).join('');

    const counts = {
      '': s.total ?? 0,
      downloading: s.downloading ?? 0,
      pending: s.pending ?? 0,
      paused: s.paused ?? 0,
      completed: s.completed ?? 0,
      failed: s.failed ?? 0,
    };
    for (const [k, v] of Object.entries(counts)) {
      const el = $(`c-${k || 'all'}`);
      if (el) el.textContent = v > 0 ? v : '';
    }
  } catch (e) {
    log(`统计失败：${e.message}`, 'err');
  }
}

/* 清理面板内的天数输入校验。
   parseInt 的结果必须显式判定：`|| 30` 会把 0 和 NaN 一起吞成 30——
   用户输入 0（本意是全部清理）或 abc，都会静默变成「清 30 天前」。
   返回 null 表示输入非法，由调用方拒绝提交。 */
function parseRetentionDays(raw) {
  const s = String(raw).trim();
  if (!/^\d+$/.test(s)) return null;
  const n = Number(s);
  if (!Number.isSafeInteger(n)) return null;
  return n;
}

let purgeBusy = false;

async function purgeTasks() {
  if (purgeBusy) return;
  const input = $('purge-days');
  if (!input) return;

  const retentionDays = parseRetentionDays(input.value);
  if (retentionDays === null) {
    $('purge-msg').textContent = '请输入非负整数天数';
    input.focus();
    toast('请输入非负整数天数', 'warn');
    return;
  }

  const scope = retentionDays === 0 ? '全部终态任务' : `${retentionDays} 天前的终态任务`;
  if (!confirm(`确认清理${scope}？此操作不可撤销。`)) return;

  purgeBusy = true;
  const btn = $('btn-purge');
  if (btn) btn.disabled = true;
  $('purge-msg').textContent = '清理中…';
  try {
    const r = await api('POST', '/api/tasks/purge', { retentionDays });
    const kept = r.retentionDays ?? retentionDays;
    const msg = `已清理 ${r.removed ?? 0} 条（保留 ${kept} 天）`;
    $('purge-msg').textContent = `已清理 ${r.removed ?? 0} 条`;
    log(msg, 'ok');
    toast(msg, 'ok');
    await refreshAll();
  } catch (e) {
    $('purge-msg').textContent = '清理失败';
    log(`清理失败：${e.message}`, 'err');
    toast(`清理失败：${e.message}`, 'err');
  } finally {
    purgeBusy = false;
    if (btn) btn.disabled = false;
  }
}

/* ═══════════════════════════════════════════════════════════════
   单行本导出
   ═══════════════════════════════════════════════════════════════ */

/** 把整本漫画合成一个 CBZ。缺章时后端会拒绝并返回还差几章。 */
async function exportComic() {
  const comicId = $('export-comic').value.trim();
  if (!comicId) {
    toast('请先填漫画 ID', 'warn');
    $('export-comic').focus();
    return;
  }

  const btn = $('btn-export');
  btn.disabled = true;
  $('export-msg').textContent = '合成中…';
  log(`开始合成单行本：${comicId}`, 'info');

  try {
    const r = await api('POST', `/api/export/comic/${encodeURIComponent(comicId)}`);
    const mb = (r.fileSize / 1024 / 1024).toFixed(1);
    const msg = `《${r.comicTitle}》${r.pageCount} 页 / ${mb} MB${r.overwritten ? '（已覆盖）' : ''}`;
    $('export-msg').textContent = '完成';
    log(`单行本导出成功：${msg}`, 'ok');
    toast(`导出成功：${msg}`, 'ok');
    await loadExports();
  } catch (e) {
    // 缺章是业务约束，不是系统故障 —— 单独用警告色，别让人以为服务挂了
    const isIncomplete = /还有 \d+ 章未下载/.test(e.message || '');
    $('export-msg').textContent = isIncomplete ? '缺章' : '失败';
    log(`导出失败：${e.message}`, isIncomplete ? 'warn' : 'err');
    toast(`导出失败：${e.message}`, isIncomplete ? 'warn' : 'err');
  } finally {
    btn.disabled = false;
  }
}

/** 拉取导出目录下已有的 CBZ 列表。 */
async function loadExports() {
  const box = $('export-list');
  try {
    const items = await api('GET', '/api/export/list');
    if (!items.length) {
      box.innerHTML = '<div class="empty"><div class="empty-text">还没有导出过单行本</div></div>';
      return;
    }
    box.innerHTML = items.map((it) => {
      const mb = (it.fileSize / 1024 / 1024).toFixed(1);
      const when = it.modifiedAt
        ? new Date(it.modifiedAt * 1000).toLocaleString('zh-CN', { hour12: false })
        : '—';
      return `<div class="export-item">
        <div class="fname" title="${esc(it.filePath)}">${esc(it.fileName)}</div>
        <div class="fmeta">${mb} MB · ${esc(when)}</div>
      </div>`;
    }).join('');
  } catch (e) {
    box.innerHTML = `<div class="empty"><div class="empty-text">列表读取失败：${esc(e.message)}</div></div>`;
  }
}

/* ═══════════════════════════════════════════════════════════════
   配置
   ═══════════════════════════════════════════════════════════════ */
async function loadConfig() {
  try {
    const cfg = await api('GET', '/api/config');
    state.config = cfg;

    const entries = Object.entries(cfg).filter(([k, v]) =>
      !CONFIG_SKIP.has(k) && (typeof v !== 'object' || v === null));

    $('config-fields').innerHTML = entries.map(([k, v]) => {
      const label = CONFIG_LABELS[k] || k;
      if (typeof v === 'boolean') {
        return `<div class="field">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" data-k="${esc(k)}" ${v ? 'checked' : ''} />
            <span>${esc(label)}</span>
          </label>
        </div>`;
      }
      const type = typeof v === 'number' ? 'number' : 'text';
      return `<div class="field">
        <label for="cfg-${esc(k)}">${esc(label)}</label>
        <input id="cfg-${esc(k)}" type="${type}" data-k="${esc(k)}" value="${esc(v ?? '')}" />
      </div>`;
    }).join('');
  } catch (e) {
    log(`载入配置失败：${e.message}`, 'err');
  }
}

async function saveConfig() {
  if (!state.config) return;
  const next = JSON.parse(JSON.stringify(state.config));

  document.querySelectorAll('#config-fields [data-k]').forEach((el) => {
    const k = el.dataset.k;
    if (el.type === 'checkbox') next[k] = el.checked;
    else if (el.type === 'number') next[k] = el.value === '' ? null : Number(el.value);
    else next[k] = el.value;
  });

  try {
    await api('POST', '/api/config', next);
    state.config = next;
    log('配置已保存', 'ok');
    toast('配置已保存（部分项需重启任务生效）', 'ok');
  } catch (e) {
    log(`保存失败：${e.message}`, 'err');
    toast(`保存失败：${e.message}`, 'err');
  }
}

/* ═══════════════════════════════════════════════════════════════
   WebSocket 实时事件
   ═══════════════════════════════════════════════════════════════ */
function setConn(stateName, text) {
  $('conn').dataset.state = stateName;
  $('conn-text').textContent = text;
}

function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  let ws;
  try { ws = new WebSocket(`${proto}://${location.host}/api/ws`); }
  catch (e) { scheduleReconnect(); return; }
  state.ws = ws;

  ws.onopen = () => {
    state.wsRetry = 0;
    state.wsLive = true;
    setConn('live', '实时已连接');
  };

  // onerror 之后浏览器必然还会触发 onclose。若两处都调用 scheduleReconnect，
  // 就会派出两条重连链，且 wsRetry 翻倍递增，退避时间提前爆炸。
  // 约定：只由 onclose 负责重连，onerror 仅更新状态文案。
  ws.onclose = () => {
    state.wsLive = false;
    setConn('down', '已断开');
    scheduleReconnect();
  };

  ws.onerror = () => setConn('down', '连接异常');

  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    const { topic, payload } = msg;

    if (topic === 'task-snapshot-event' && Array.isArray(payload)) {
      // 快照是「所有未完结任务」的全量列表，且排序是「内存任务优先 + DB created_at ASC」；
      // 而任务列表走的是分页 API（updated_at DESC + state/comicId 筛选）。
      // 两者语义不同，直接 state.tasks = payload 会把列表撑成全量、冲掉筛选和页码。
      //
      // 所以不拿快照当列表数据源，只用它当「有变化」的信号，重新拉当前页——
      // 这样分页 / 排序 / 筛选的唯一真相源始终是 API。
      //
      // 注意别丢掉它的作用：连接刚建立时若只依赖轮询，第 2 页会看到过期数据；
      // 这里主动拉一次，保证连上就能拿到当前页的最新状态。
      loadTasks();
      return;
    }
    if (topic === 'download-task-event') {
      applyTaskEvent(payload);
    }
  };
}

function scheduleReconnect() {
  const delay = Math.min(1000 * 2 ** state.wsRetry, 15000);
  state.wsRetry++;
  setConn('down', `已断开，${Math.round(delay / 1000)} 秒后重连`);
  setTimeout(connectWs, delay);
}

function applyTaskEvent(ev) {
  if (!ev || !ev.event) return;
  const d = ev.data || {};

  if (ev.event === 'Create') {
    const ch = d.chapterInfo || {};
    log(`新建任务：${d.comic?.title || ''} / ${ch.title || ch.chapterId || ''}`, 'info');
    loadStats();
    loadTasks();
    return;
  }

  if (ev.event === 'Update') {
    const t = state.tasks.find((x) => x.chapterId === d.chapterId);
    if (t) {
      t.state = d.state;
      t.doneImgCount = d.downloadedImgCount;
      t.totalImgCount = d.totalImgCount;
      if (d.retryCount !== undefined) t.retryCount = d.retryCount;
      if (d.lastError !== undefined) t.lastError = d.lastError;
      t.progress = d.totalImgCount > 0
        ? Math.round((d.downloadedImgCount / d.totalImgCount) * 1000) / 10
        : 0;
      renderTasks();
    }
    if (d.state === 'completed' || d.state === 'failed') {
      log(`任务${STATE_LABEL[d.state] || d.state}：${d.chapterId}（${d.downloadedImgCount}/${d.totalImgCount}）`,
          d.state === 'completed' ? 'ok' : 'err');
      loadStats();

      // 进入终态后该任务是否还属于当前列表，取决于当前筛选：
      //  - 无筛选 / 筛选状态与终态不符 → 列表成员变了，必须重拉
      //  - 筛选态恰好就是 completed/failed → 成员没变，只需 renderTasks（上面已做）
      // 不重拉的话，在「下载中」标签页里，完成的任务会一直挂在列表上显示为已完成。
      const inList = state.tasks.some((x) => x.chapterId === d.chapterId);
      const stillMatches = !state.filterState || state.filterState === d.state;
      if (inList && !stillMatches) loadTasks();
    }
  }
}

/* ═══════════════════════════════════════════════════════════════
   初始化
   ═══════════════════════════════════════════════════════════════ */

/* 任务行动作按钮的委托监听。
   由 renderTasks 输出 data-act / data-cid，这里统一分发——
   值只经 dataset 读取，不参与 JS 源码拼接，因此 chapterId 含引号也无害。 */
function bindTaskActions() {
  $('task-rows').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const cid = b.dataset.cid;
    switch (b.dataset.act) {
      case 'pause':  taskAction(cid, 'pause');  break;
      case 'resume': taskAction(cid, 'resume'); break;
      case 'cancel': taskAction(cid, 'cancel'); break;
      case 'retry':  retryTask(cid);            break;
      case 'delete': deleteTask(cid);           break;
    }
  });

  /* 表头全选：只作用于当前页可见的行。
     跨页选择由 state.selectedIds 保留，这里不越界去动别的页。 */
  $('check-all').addEventListener('change', (e) => {
    for (const b of document.querySelectorAll('.row-check')) {
      if (e.target.checked) state.selectedIds.add(b.dataset.cid);
      else state.selectedIds.delete(b.dataset.cid);
    }
    syncSelection();
  });

  /* 行勾选用委托：行是 renderTasks 动态生成的，逐个绑定会随每次重绘失效。 */
  $('task-rows').addEventListener('change', (e) => {
    const b = e.target.closest('.row-check');
    if (!b) return;
    if (b.checked) state.selectedIds.add(b.dataset.cid);
    else state.selectedIds.delete(b.dataset.cid);
    syncSelection();
  });
}

async function refreshAll() {
  await Promise.all([loadTasks(), loadStats(), loadExports()]);
}

log('控制台已就绪', 'info');
bindTaskActions();
loadConfig();
refreshAll();
connectWs();
/* 兜底轮询：只在 WS 未连通时跑。
   WS 连通时统计由事件驱动刷新，再每 15 秒打一次 API 纯属重复请求。
   WS 断开时它顶上，保证数字不会停在旧值。 */
setInterval(() => {
  if (!state.wsLive) loadStats();
}, 15000);
</script>
